name: verify-protected
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Проверить, что ocbot.zip — защищённая (обфусцированная) сборка
        run: python3 verify_protected.py ocbot.zip
