name: verify-protected
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Проверить, что ocbot.zip — защищённая (обфусцированная) сборка
        run: python3 verify_protected.py ocbot.zip

      - name: Проверка ocbot.zip на VirusTotal
        if: ${{ env.VT_API_KEY != '' }}
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          HASH=$(sha256sum ocbot.zip | cut -d' ' -f1)
          echo "sha256: $HASH"

          # Если этот файл уже когда-то сканировали — просто переиспользуем отчёт по хэшу.
          STATUS=$(curl -sS -o /tmp/vt_report.json -w '%{http_code}' \
            -H "x-apikey: $VT_API_KEY" \
            "https://www.virustotal.com/api/v3/files/$HASH" || true)

          if [ "$STATUS" != "200" ]; then
            echo "Хэш ещё не встречался VirusTotal — заливаю файл на сканирование"
            ANALYSIS_URL=$(curl -sS -X POST "https://www.virustotal.com/api/v3/files" \
              -H "x-apikey: $VT_API_KEY" -F "file=@ocbot.zip" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['links']['self'])")

            # Ждём завершения анализа (обычно 20-60 секунд для такого размера файла)
            for i in $(seq 1 20); do
              sleep 10
              STATE=$(curl -sS -H "x-apikey: $VT_API_KEY" "$ANALYSIS_URL" \
                | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['attributes']['status'])")
              echo "попытка $i: статус анализа — $STATE"
              [ "$STATE" = "completed" ] && break
            done

            curl -sS -H "x-apikey: $VT_API_KEY" \
              "https://www.virustotal.com/api/v3/files/$HASH" -o /tmp/vt_report.json
          fi

          python3 - "$HASH" <<'PYEOF'
          import json, sys, datetime
          h = sys.argv[1]
          d = json.load(open('/tmp/vt_report.json'))['data']['attributes']
          stats = d['last_analysis_stats']
          malicious = stats.get('malicious', 0)
          suspicious = stats.get('suspicious', 0)
          total = sum(stats.values())
          out = {
              "sha256": h,
              "malicious": malicious,
              "suspicious": suspicious,
              "total_engines": total,
              "clean": malicious == 0 and suspicious == 0,
              "report_url": f"https://www.virustotal.com/gui/file/{h}",
              "scanned_at": datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
          }
          json.dump(out, open('vt-status.json', 'w'), ensure_ascii=False, indent=2)
          print(json.dumps(out, ensure_ascii=False, indent=2))
          if not out["clean"]:
              print("::error::VirusTotal пометил сборку как подозрительную/вредоносную — релиз остановлен")
              sys.exit(1)
          PYEOF

      - name: Закоммитить результат сканирования
        if: ${{ env.VT_API_KEY != '' }}
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          if [ -f vt-status.json ]; then
            git config user.name "ocbot-ci"
            git config user.email "ci@ocbotauto.users.noreply.github.com"
            git add vt-status.json
            # git diff не видит совсем новый файл как изменение — проверяем staged-диф,
            # а не просто diff --quiet, иначе первый коммит vt-status.json всегда пропускается.
            if ! git diff --cached --quiet -- vt-status.json; then
              git commit -m "vt-status: обновлён отчёт VirusTotal для ocbot.zip [skip ci]"
              git push
            else
              echo "vt-status.json не изменился — коммит не нужен"
            fi
          fi
